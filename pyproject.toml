[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-api"
version = "0.1.0"
description = "TaskFlow Task Management REST API"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn"
]

[tool.setuptools.packages.find]
include = ["app*"]