---
- name: Install required packages
  become: true
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
    state: present
    update_cache: yes

- name: Create TaskFlow application directory
  become: true
  file:
    path: "{{ app_directory }}"
    state: directory
    mode: '0755'

- name: Clone TaskFlow repository
  become: true
  git:
    repo: "{{ repo_url }}"
    dest: "{{ app_directory }}"
    version: "{{ repo_branch }}"
    update: yes
- name: Create Python virtual environment
  become: true
  command:
    cmd: python3 -m venv {{ app_directory }}/venv
    creates: "{{ app_directory }}/venv/bin/python"

- name: Install TaskFlow dependencies
  become: true
  pip:
    requirements: "{{ app_directory }}/requirements.txt"
    virtualenv: "{{ app_directory }}/venv"
- name: Configure TaskFlow systemd service
  become: true
  template:
    src: taskflow.service.j2
    dest: /etc/systemd/system/{{ service_name }}.service
    mode: '0644'
  notify: Restart TaskFlow service

- name: Enable and start TaskFlow service
  become: true
  systemd:
    name: "{{ service_name }}"
    enabled: yes
    state: started
    daemon_reload: yes
